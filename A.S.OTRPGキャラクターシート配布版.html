<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A.S.O.TRPG のローカル利用向けキャラクターシート" />
    <title>A.S.OTRPGキャラクターシート</title>
    <style>
:root {
  color-scheme: dark;
  --ink: #edf1f4;
  --muted: #98a5ae;
  --canvas: #111519;
  --panel: #191f24;
  --panel-strong: #222a30;
  --line: #3a464e;
  --line-soft: #283239;
  --accent: #e3b341;
  --accent-strong: #ffd166;
  --cyan: #6bc4cc;
  --red: #e46262;
  --green: #82c991;
  --shadow: 0 12px 30px rgb(0 0 0 / 24%);
  font-family: Inter, "Noto Sans JP", "Yu Gothic UI", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 960px; background: var(--canvas); color: var(--ink); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  min-height: 72px;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 10px max(24px, calc((100vw - 1440px) / 2));
  border-bottom: 1px solid var(--line);
  background: rgb(17 21 25 / 96%);
  backdrop-filter: blur(14px);
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid var(--accent); color: var(--accent-strong); font-family: "Arial Narrow", sans-serif; font-weight: 800; letter-spacing: 0; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.save-indicator { margin-right: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }

.mode-button, .icon-button, .secondary-button {
  min-height: 34px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink);
}
.mode-button { min-width: 52px; padding: 5px 10px; }
.mode-button.active { border-color: var(--accent); background: #3b321c; color: var(--accent-strong); }
.icon-button { display: grid; width: 34px; place-items: center; font-size: 18px; line-height: 1; }
.icon-button:hover, .secondary-button:hover, .mode-button:hover { border-color: var(--cyan); background: var(--panel-strong); }
.icon-button.danger { color: #ffb3b3; }
.export-picker { display: block; }
.export-select { min-height: 34px; max-width: 158px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; }
.export-select:hover, .export-select:focus { border-color: var(--cyan); background: var(--panel-strong); outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.app-layout { width: min(1440px, calc(100% - 48px)); margin: 26px auto 52px; }
.edit-layout { display: grid; grid-template-columns: minmax(0, 1fr) 332px; align-items: start; gap: 22px; }
.editor-column { display: grid; gap: 18px; min-width: 0; }
.editor-section, .summary-panel, .view-section, .sheet-identity { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: var(--shadow); }
.editor-section { padding: 18px; }
.section-heading, .view-section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
.section-heading h2, .view-section-heading h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0; }
.section-heading span, .view-section-heading span { color: var(--muted); font-size: 12px; text-align: right; }

.form-grid, .custom-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; min-width: 0; gap: 5px; }
.field-wide { grid-column: 1 / -1; }
.field > span { color: var(--muted); font-size: 12px; }
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 36px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  outline: none;
  background: #101519;
  color: var(--ink);
}
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgb(107 196 204 / 14%); }
.muted-field { padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #151b1f; }
.muted-field b { font-weight: 600; }

.technique-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
.combo-wrap { position: relative; z-index: 2; }
.combo-wrap:focus-within { z-index: 10; }
.suggestions { position: absolute; z-index: 20; top: calc(100% - 2px); right: 0; left: 0; display: none; max-height: 278px; overflow: auto; padding: 4px; border: 1px solid var(--cyan); border-radius: 4px; background: #11171b; box-shadow: 0 16px 30px rgb(0 0 0 / 42%); }
.combo-wrap.is-open .suggestions { display: grid; }
.suggestion { width: 100%; padding: 8px 9px; border: 0; border-radius: 3px; background: transparent; color: var(--ink); text-align: left; }
.suggestion:hover { background: #25343a; color: #fff; }
.no-suggestion { margin: 0; padding: 8px 9px; color: var(--muted); }

.assemble-row { position: relative; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.assemble-row:first-child { padding-top: 0; }
.assemble-row:last-child { padding-bottom: 0; border-bottom: 0; }
.selected-info { display: grid; gap: 2px; margin-top: 7px; padding: 8px 10px; border-left: 2px solid var(--cyan); background: #141b1f; color: var(--muted); }
.selected-info b { color: var(--ink); font-size: 13px; }
.selected-info small { color: #b4c1c9; }
.selected-info.compact { padding-right: 16px; }
.custom-details { margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: #141a1e; }
.custom-details summary { color: var(--accent-strong); cursor: pointer; }
.custom-grid { margin-top: 10px; }

.weapon-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 30px; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.weapon-row:first-child { padding-top: 0; }
.weapon-row:last-child { padding-bottom: 0; border-bottom: 0; }
.row-index { display: grid; width: 26px; height: 26px; place-items: center; margin-top: 23px; border: 1px solid var(--line); border-radius: 3px; color: var(--accent-strong); font-weight: 700; }
.remove-row { display: grid; width: 28px; height: 28px; place-items: center; margin-top: 23px; border: 1px solid #744; border-radius: 3px; background: #321c20; color: #ffacac; font-size: 18px; line-height: 1; }
.remove-row:hover { background: #5a252c; }
.consumable-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.consumable-row { position: relative; min-width: 0; padding-right: 34px; }
.consumable-row .remove-row { position: absolute; top: 0; right: 0; margin-top: 23px; }

.summary-panel { position: sticky; top: 96px; overflow: hidden; }
.status-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
.stat-card { min-height: 94px; padding: 13px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.stat-card:nth-child(2n) { border-right: 0; }
.stat-card span { display: block; color: var(--muted); font-size: 12px; }
.stat-card strong { display: block; margin: 2px 0; color: var(--accent-strong); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat-card small { color: var(--muted); }
.summary-numbers { display: grid; grid-template-columns: repeat(2, 1fr); border-bottom: 1px solid var(--line-soft); }
.summary-numbers > div { display: grid; gap: 2px; padding: 13px; border-right: 1px solid var(--line-soft); }
.summary-numbers > div:last-child { border-right: 0; }
.summary-numbers span { color: var(--muted); font-size: 12px; }
.summary-numbers strong { color: var(--cyan); font-size: 22px; font-variant-numeric: tabular-nums; }
.summary-numbers small { color: var(--muted); }
.negative { color: var(--red) !important; }
.warning-panel { padding: 14px; }
.warning-panel h3 { margin: 0 0 8px; color: var(--accent-strong); font-size: 13px; }
.warning-panel ul, .item-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.warning-panel li, .item-list li { display: grid; gap: 2px; padding: 8px; border-left: 2px solid var(--red); background: #251b1d; }
.warning-panel li span, .item-list li span { color: #c3cbd0; font-size: 12px; }
.warning-panel li.good { border-color: var(--green); background: #17241c; }

.sheet-text { width: 100%; min-height: 300px; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: #101519; color: #d8e2e7; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; line-height: 1.55; resize: vertical; }
.output-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.secondary-button { padding: 7px 11px; }

.view-shell { width: min(1080px, calc(100% - 48px)); margin: 30px auto 52px; }
.sheet-identity { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 20px; align-items: end; padding: 24px; border-top: 3px solid var(--accent); }
.sheet-identity span { color: var(--muted); font-size: 12px; }
.sheet-identity h2 { margin: 3px 0 0; color: var(--accent-strong); font-size: 24px; font-weight: 700; letter-spacing: 0; overflow-wrap: anywhere; }
.sheet-identity dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.sheet-identity dl div { padding-left: 10px; border-left: 1px solid var(--line); }
.sheet-identity dt { color: var(--muted); font-size: 11px; }
.sheet-identity dd { margin: 2px 0 0; font-weight: 600; }
.view-section { margin-top: 16px; padding: 18px; }
.view-stats { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line-soft); border-radius: 4px; overflow: hidden; }
.view-stats .stat-card { min-height: 82px; }
.view-stats .stat-card:nth-child(2n) { border-right: 1px solid var(--line-soft); }
.view-stats .stat-card:last-child { border-right: 0; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
thead th { border-bottom-color: var(--line); background: #141a1e; color: #bcc7ce; }
.technique-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.technique-card { min-height: 122px; padding: 13px; border: 1px solid #3c4b45; border-radius: 4px; background: #18211e; }
.technique-card.weakness { border-color: #5a3b3c; background: #251b1d; }
.technique-card > span { color: var(--cyan); font-size: 11px; }
.technique-card.weakness > span { color: #ec9999; }
.technique-card h3 { margin: 4px 0; font-size: 15px; }
.technique-card p { margin: 0; color: #c0cbd0; font-size: 12px; }
.technique-card b { display: block; margin-top: 7px; color: var(--accent-strong); font-size: 12px; }
.view-bottom { display: grid; grid-template-columns: 1fr 1.1fr; gap: 20px; }
.view-warnings { margin: 0; padding: 0; }
.memo-view { margin: 0; white-space: pre-wrap; }
.page-footer { padding: 0 24px 30px; color: var(--muted); font-size: 11px; text-align: center; }

@media (max-width: 1100px) {
  body { min-width: 720px; }
  .edit-layout { grid-template-columns: minmax(0, 1fr) 292px; }
  .topbar { padding-right: 24px; padding-left: 24px; }
  .view-stats { grid-template-columns: repeat(3, 1fr); }
  .view-stats .stat-card:nth-child(2n) { border-right: 1px solid var(--line-soft); }
  .view-stats .stat-card:nth-child(3n) { border-right: 0; }
}

@media (max-width: 760px) {
  body { min-width: 0; }
  .topbar { position: static; align-items: flex-start; padding: 12px; }
  .brand h1 { font-size: 13px; }
  .brand-mark { width: 38px; height: 38px; font-size: 12px; }
  .save-indicator { display: none; }
  .topbar-actions { flex-wrap: wrap; justify-content: flex-end; }
  .app-layout, .view-shell { width: min(100% - 24px, 680px); margin-top: 12px; }
  .edit-layout { display: block; }
  .summary-panel { position: static; margin-top: 16px; }
  .form-grid, .custom-grid, .technique-grid, .consumable-grid { grid-template-columns: 1fr; }
  .sheet-identity { grid-template-columns: 1fr; gap: 14px; }
  .sheet-identity dl { grid-template-columns: repeat(3, 1fr); }
  .view-bottom { grid-template-columns: 1fr; }
  .technique-cards { grid-template-columns: 1fr; }
  .view-stats { grid-template-columns: repeat(2, 1fr); }
  .view-stats .stat-card:nth-child(3n) { border-right: 1px solid var(--line-soft); }
  .view-stats .stat-card:nth-child(2n) { border-right: 0; }
}

:root {
  color-scheme: light;
  --ink: #1f2933;
  --muted: #68737d;
  --canvas: #ffffff;
  --panel: #ffffff;
  --panel-strong: #f5f7f8;
  --line: #d7dde1;
  --line-soft: #e7ebee;
  --accent: #a6691b;
  --accent-strong: #8a5512;
  --cyan: #087e8b;
  --red: #b64038;
  --green: #237a4b;
  --shadow: none;
}

body {
  min-width: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Yu Gothic UI", "Meiryo", sans-serif;
}

.topbar {
  min-height: 62px;
  padding: 10px max(22px, calc((100vw - 1280px) / 2));
  border-color: #aeb9c0;
  background: rgb(255 255 255 / 96%);
  backdrop-filter: blur(12px);
}

.brand { gap: 10px; }
.brand-mark {
  width: 40px;
  height: 40px;
  border-color: var(--accent);
  color: var(--accent);
  font: 700 12px/1 Arial, sans-serif;
}
.brand h1 { color: var(--ink); font-size: 15px; }
.brand p, .save-indicator { color: var(--muted); }
.topbar-actions { gap: 6px; }

.mode-button,
.icon-button,
.secondary-button,
.export-select {
  border-color: #aeb9c0;
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
}
.mode-button.active {
  border-color: var(--accent);
  background: #fffaf2;
  color: var(--accent-strong);
}
.icon-button:hover,
.secondary-button:hover,
.mode-button:hover,
.export-select:hover {
  border-color: var(--cyan);
  background: #f0f8f9;
}
.icon-button.danger { color: var(--red); }
.export-select:focus { border-color: var(--cyan); background: #fff; }

.app-layout.wireframe-layout {
  width: min(1220px, calc(100% - 40px));
  margin: 0 auto 48px;
}
.wireframe-layout .editor-column { display: block; }

.edit-identity {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  margin: 0;
  padding: 26px 0 20px;
  border: 0;
  border-bottom: 2px solid var(--ink);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.portrait-slot {
  display: grid;
  aspect-ratio: 1;
  place-items: center;
  border: 1px dashed #aeb9c0;
  background: #f5f7f8;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.identity-copy { display: grid; gap: 5px; align-content: start; min-width: 0; }
.identity-copy h2 {
  margin: 0;
  color: var(--ink);
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}
.eyebrow { margin: 0; color: var(--muted); font-size: 12px; }
.machine-name { margin: 0; color: var(--accent); font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.identity-detail { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

.inline-stats {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  margin: 0;
  border-bottom: 1px solid #aeb9c0;
}
.inline-stat {
  min-height: 86px;
  padding: 12px;
  border-right: 1px solid var(--line);
}
.inline-stat:first-child { border-left: 1px solid var(--line); }
.inline-stat dt { color: var(--muted); font-size: 12px; }
.inline-stat dd {
  margin: 5px 0 0;
  color: var(--accent);
  font-size: 25px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.inline-stat small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.inline-stat .teal { color: var(--cyan); }
.inline-stat .negative { color: var(--red); }

.wireframe-layout .editor-section {
  margin: 0;
  padding: 24px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.wireframe-layout .section-heading {
  margin: 0 0 14px;
  padding: 0;
  border: 0;
}
.wireframe-layout .section-heading h2 { color: var(--ink); font-size: 17px; }
.wireframe-layout .section-heading span { color: var(--muted); font-size: 12px; }

.wireframe-layout .form-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.wireframe-layout .field { gap: 5px; }
.wireframe-layout .field > span { color: var(--muted); font-size: 12px; }
.wireframe-layout .field input,
.wireframe-layout .field select,
.wireframe-layout .field textarea {
  border-color: #aeb9c0;
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
}
.wireframe-layout .field input:focus,
.wireframe-layout .field select:focus,
.wireframe-layout .field textarea:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgb(8 126 139 / 14%);
}
.wireframe-layout .muted-field {
  border-color: #aeb9c0;
  background: #f5f7f8;
  color: var(--ink);
}
.wireframe-layout .technique-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 16px;
  padding-top: 16px;
  border-color: var(--line);
}
.wireframe-layout .technique-grid .field-wide { grid-column: span 2; }

.wireframe-layout .profile-memo-layout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  margin-bottom: 18px;
}
.wireframe-layout .personal-column,
.wireframe-layout .memo-column {
  display: grid;
  align-content: start;
  gap: 12px;
  min-width: 0;
}
.wireframe-layout .memo-column .field-wide { grid-column: auto; }
.wireframe-layout .memo-column textarea { min-height: 181px; height: 181px; }
.wireframe-layout .image-editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.wireframe-layout .image-editor-slot {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(156px, 0.7fr);
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
}
.wireframe-layout .image-editor-preview {
  display: grid;
  min-height: 164px;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  place-items: center;
  border-right: 1px solid var(--line);
  background: #f5f7f8;
  color: var(--muted);
  font-size: 12px;
}
.wireframe-layout .image-editor-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.wireframe-layout .image-editor-controls {
  display: grid;
  align-content: center;
  gap: 8px;
  padding: 14px;
}
.wireframe-layout .image-editor-controls b { color: var(--ink); }
.wireframe-layout .image-editor-controls small {
  min-height: 18px;
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.wireframe-layout .image-editor-controls > div { display: flex; flex-wrap: wrap; gap: 6px; }
.wireframe-layout .image-upload-button,
.wireframe-layout .image-remove-button {
  display: inline-flex;
  min-height: 32px;
  align-items: center;
  justify-content: center;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: var(--ink);
  font-size: 12px;
  cursor: pointer;
}
.wireframe-layout .image-upload-button:hover { border-color: var(--cyan); background: #effafa; }
.wireframe-layout .image-remove-button { border-color: #d7b3b0; color: var(--red); }
.wireframe-layout .image-remove-button:hover { background: #fff1f0; }
.wireframe-layout .image-upload-button input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.wireframe-layout .build-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.wireframe-layout .build-grid .field-wide { grid-column: span 2; }
.wireframe-layout .build-empty { min-height: 36px; }

.table-wrap { overflow-x: auto; }
.wireframe-layout table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
  font-size: 13px;
}
.wireframe-layout th,
.wireframe-layout td {
  padding: 9px 10px;
  border: 1px solid var(--line);
  color: var(--ink);
  text-align: left;
  vertical-align: top;
}
.wireframe-layout thead th {
  background: #f5f7f8;
  color: var(--muted);

const num = (value) => {

function createDefaultState() {

function hydrateState(candidate) {
  const base = createDefaultState();
  if (!candidate || typeof candidate !== "object") return base;
  const state = clone(base);
  state.schemaVersion = 1;
  state.updatedAt = typeof candidate.updatedAt === "string" ? candidate.updatedAt : "";
  state.meta = { ...base.meta, ...(candidate.meta ?? {}) };
  state.origin = typeof candidate.origin === "string" ? candidate.origin : base.origin;
  state.humanBonus = candidate.humanBonus === "hit" ? "hit" : "evade";
  state.classes = { ...base.classes, ...(candidate.classes ?? {}) };
  for (const slot of PART_SLOTS) {
    const source = candidate.parts?.[slot] ?? {};
    state.parts[slot] = { id: typeof source.id === "string" ? source.id : "", custom: { ...customPart(), ...(source.custom ?? {}) } };
  }
  state.weapons = Array.from({ length: 4 }, (_, index) => {
    const source = candidate.weapons?.[index] ?? {};
    return { id: typeof source.id === "string" ? source.id : "", custom: { ...customWeapon(), ...(source.custom ?? {}) } };

    ? candidate.consumables.filter((entry) => entry?.id || Object.values(entry?.custom ?? {}).some((value) => String(value ?? "").trim()))

  return {
    id: "custom-weapon",
    company: custom.company || "カスタム",
    category: custom.category || "light",
    type: custom.type || "未設定",
    name: custom.name,
    price: num(custom.price),
    power: custom.power || "未設定",
    weight: num(custom.weight),
    output: num(custom.output),
    range: custom.range || "未設定",
    attribute: custom.attribute || "未設定",
    traits: custom.traits,
    flags: [],
    isCustom: true,
  };
}

function resolveConsumable(entry) {
  const selected = entry?.id ? findConsumable(entry.id) : null;
  if (selected) return selected;
  const custom = entry?.custom ?? customConsumable();
  if (!custom.name.trim()) return null;
  return { id: "custom-item", name: custom.name, price: num(custom.price), timing: custom.timing || "未設定", effect: custom.effect || "", isCustom: true };
}

const findTechnique = (id) => allClassTechniques().find((item) => item.id === id) ?? null;
const selectedTechniqueIds = (state) => [state.techniques.passive, ...state.techniques.active].filter(Boolean);
const hasTechnique = (state, id) => selectedTechniqueIds(state).includes(id);
const addWarning = (list, code, title, detail) => list.push({ code, title, detail });
const formatSigned = (value) => (value > 0 ? `+${value}` : String(value));

function calculate(state) {
  const warnings = [];
  const notices = [
    { title: "未確定ルール", detail: "脚部制限の意味とメイン/サブ同一クラスの可否は、現時点では確定していません。" },
    { title: "ローカル下書き", detail: "このブラウザ内に自動保存します。JSON出力は明示操作のときだけ行います。" },
  ];
  const resolvedParts = Object.fromEntries(PART_SLOTS.map((slot) => [slot, resolvePart(state.parts[slot], slot)]));
  const resolvedWeapons = state.weapons.map(resolveWeapon);
  const resolvedConsumables = state.consumables.map(resolveConsumable);
  const origin = findOrigin(state.origin) ?? findOrigin("human");
  const mainClass = findClass(state.classes.main);
  const subClass = findClass(state.classes.sub);

  const statAdjustments = { ap: 0, action: 0, hit: 0, evade: 0, output: 0, armor: 0, load: 0 };
  const breakdown = Object.fromEntries(Object.keys(statAdjustments).map((key) => [key, []]));
  const add = (key, amount, label) => {
    if (!amount) return;
    statAdjustments[key] += amount;
    breakdown[key].push({ label, amount });
  };

  for (const [slot, item] of Object.entries(resolvedParts)) {
    if (!item) continue;
    for (const [key, amount] of Object.entries(item.modifiers ?? {})) add(key, amount, `${SLOT_LABELS[slot]}: ${item.name}`);
    if (item.isCustom) {
      for (const key of ["price", "ap", "action", "hit", "evade", "output", "load", "armor"]) {
        if (key === "price" ? item.price === null : state.parts[slot].custom[key] === "") {
          addWarning(warnings, `custom-part-${slot}-${key}`, "カスタムパーツの数値が不足", `${SLOT_LABELS[slot]}「${item.name}」の${key === "price" ? "価格" : key}が未入力です。`);
        }
      }
    }
  }
  if (resolvedParts.generator?.id === "generator-kurogane" && resolvedParts.torso) {
    const torsoOutput = resolvedParts.torso.modifiers.output ?? 0;
    if (torsoOutput) {
      statAdjustments.output -= torsoOutput;
      breakdown.output = breakdown.output.filter((item) => item.label !== `胴体: ${resolvedParts.torso.name}`);
      breakdown.output.push({ label: "黒鉄: 胴体出力修正を0", amount: -torsoOutput });
    }
  }
  for (const [key, amount] of Object.entries(origin.modifiers ?? {})) add(key, amount, `出自: ${origin.name}`);
  if (origin.id === "human") add(state.humanBonus, 1, "人間の選択補正");
  if (mainClass?.id === "operator") add("hit", 2, "メイン: オペレーター");
  if (mainClass?.id === "vanguard") add(state.classes.vanguardBonus === "armor" ? "armor" : "evade", 1, "メイン: ヴァンガード");
  if (hasTechnique(state, "class-assaulter-rapid")) {
    const option = state.techniques.choices["class-assaulter-rapid"];
    if (option === "short") add("evade", -2, "ラピッド・ファイア（近距離特化）");
    if (option === "long") add("action", -1, "ラピッド・ファイア（遠距離特化）");
  }
  if (hasTechnique(state, "class-vanguard-defense")) {
    const option = state.techniques.choices["class-vanguard-defense"];
    if (option === "ap") add("ap", 10, "ディフェンス・セッティング（AP）");
    if (option === "evade") add("evade", 1, "ディフェンス・セッティング（回避）");
  }
  for (const item of resolvedWeapons.filter(Boolean)) {
    if (item.flags?.includes("action-minus-2")) add("action", -2, `${item.name}: 装備中修正`);
    if (item.flags?.includes("action-minus-1")) add("action", -1, `${item.name}: 装備中修正`);
    if (item.id === "weapon-iwao") add("armor", 3, "巌: 装備中修正");
  }

  const stats = {
    ap: BASE_STATS.ap + statAdjustments.ap,
    action: BASE_STATS.action + statAdjustments.action,
    hit: BASE_STATS.hit + statAdjustments.hit,
    evade: BASE_STATS.evade + statAdjustments.evade,
    output: BASE_STATS.output + statAdjustments.output,
    armor: statAdjustments.armor,
    load: statAdjustments.load,
  };
  const generatorOutput = resolvedParts.generator?.modifiers?.output ?? 0;
  const outputRecovery = generatorOutput + 2;

  const equippedWeapons = resolvedWeapons.filter(Boolean);
  const categoryCounts = { light: 0, heavy: 0, melee: 0, special: 0 };
  for (const item of equippedWeapons) categoryCounts[item.category] = (categoryCounts[item.category] ?? 0) + 1;
  const lightLike = categoryCounts.light + categoryCounts.melee;
  const heavyLike = categoryCounts.heavy + categoryCounts.special;
  const reducedWeaponSlots = equippedWeapons.reduce((count, item) => count + (item.flags?.includes("reduces-light") ? 1 : 0), 0);
  const limits = { total: 4 - reducedWeaponSlots, light: 4, heavy: 2, melee: 1, special: 1 };
  const totalWeight = equippedWeapons.reduce((sum, item) => sum + (item.weight ?? 0), 0);
  const hasUnknownWeight = equippedWeapons.some((item) => item.weight === null);
  const remainingLoad = stats.load - totalWeight;
  const damageBonusFor = (item) => {
    let amount = 0;
    if (mainClass?.id === "assaulter") amount += 2;
    if (resolvedParts.legs?.id === "legs-yamato" && item.category === "melee") amount += 2;
    if (resolvedParts.generator?.id === "generator-eternal" && item.attribute === "ビーム") amount += 3;
    if (equippedWeapons.some((weapon) => weapon.id === "weapon-ammo-box") && item.attribute === "実弾") amount += 1;
    if (hasTechnique(state, "class-assaulter-rapid") && state.techniques.choices["class-assaulter-rapid"] === "short") amount += 2;
    if (hasTechnique(state, "class-assaulter-rapid") && state.techniques.choices["class-assaulter-rapid"] === "long") amount += 1;
    return amount;
  };
  const weaponsWithBonuses = resolvedWeapons.map((item) => item ? { ...item, damageBonus: damageBonusFor(item) } : null);

  if (mainClass && subClass && mainClass.id === subClass.id) addWarning(warnings, "same-class", "メインとサブが同一クラス", "同一クラス選択の可否は製作者未確認です。現状は保存できます。 ");
  for (const slot of PART_SLOTS) if (!resolvedParts[slot]) addWarning(warnings, `missing-${slot}`, "未選択の構成パーツ", `${SLOT_LABELS[slot]}を選択またはカスタム入力してください。`);
  if (equippedWeapons.length > limits.total) {
    const restrictedNames = equippedWeapons.filter((item) => item.flags?.includes("reduces-light")).map((item) => `「${item.name}」`).join("、");
    const detail = restrictedNames
      ? `${restrictedNames}は背部特殊武装の枠に加え、軽量武装を装備不可にするぶんの1枠も消費します。武装枠は${limits.total}枠までです。`
      : "武装は4枠までです。";
    addWarning(warnings, "weapon-total", "武装枠超過", detail);
  }
  if (lightLike > limits.light) addWarning(warnings, "weapon-light", "軽量武装枠超過", `軽量武装扱いは${limits.light}枠までです。近接武装も軽量武装として数えます。`);
  if (heavyLike > limits.heavy) addWarning(warnings, "weapon-heavy", "重量武装枠超過", `重量武装扱いは${limits.heavy}枠までです。背部特殊武装も重量武装として数えます。`);
  if (categoryCounts.melee > limits.melee) addWarning(warnings, "weapon-melee", "近接武装枠超過", "近接武装は1つまでです。");
  if (categoryCounts.special > limits.special) addWarning(warnings, "weapon-special", "背部特殊武装枠超過", "背部特殊武装は1つまでです。");
  if (!hasUnknownWeight && remainingLoad < 0) addWarning(warnings, "overload", "積載超過", `武装重量${totalWeight}に対し、積載上限は${stats.load}です。`);
  if (hasUnknownWeight) addWarning(warnings, "unknown-weight", "武装重量が不足", "カスタム武装の重量が未入力のため、積載を確定できません。");

  const special = equippedWeapons.find((item) => item.id === "weapon-barrier");
  if (special && categoryCounts.heavy > 0) addWarning(warnings, "barrier-heavy", "位相偏向器と重量武装", "位相偏向器は重量武装を装備不可としています。保存はできます。 ");
  if (special && equippedWeapons.some((item) => item.attribute === "ビーム")) addWarning(warnings, "barrier-beam", "位相偏向器とビーム武装", "位相偏向器の使用中はビーム属性武装を使用不可です。戦術上の注意として確認してください。 ");
  if (equippedWeapons.some((item) => item.id === "weapon-scope") && !equippedWeapons.some((item) => ["キャノン", "スナイパーライフル"].includes(item.type))) addWarning(warnings, "scope-requirement", "高精度狙撃スコープの対象不足", "同時使用対象のキャノンまたはスナイパーライフルがありません。 ");
  if (equippedWeapons.some((item) => item.id === "weapon-ammo-box")) addWarning(warnings, "ammo-box-choice", "増設弾薬箱の装備不可枠", "軽量または重量武装を1つ装備不可にする選択が必要です。現時点では自動判定していません。 ");
  if (equippedWeapons.some((item) => item.flags?.includes("uncertain-attribute"))) addWarning(warnings, "seisou-attribute", "星霜:ツインブレードの属性未記載", "ルールデータに属性が明記されていないため、属性依存の補正を適用していません。 ");
  for (const item of equippedWeapons.filter((item) => item.isCustom)) {
    for (const key of ["price", "weight", "output"]) {
      if (item[key] === null) addWarning(warnings, `custom-weapon-${item.name}-${key}`, "カスタム武装の数値が不足", `「${item.name}」の${key === "price" ? "価格" : key === "weight" ? "重量" : "消費出力"}が未入力です。`);
    }
  }

  const purchases = [...Object.values(resolvedParts), ...equippedWeapons, ...resolvedConsumables.filter(Boolean)];
  const unknownPrice = purchases.some((item) => item && item.price === null);
  const totalCost = purchases.reduce((sum, item) => sum + (item?.price ?? 0), 0);
  const remainingCredits = STARTING_CREDITS - totalCost;
  if (unknownPrice) addWarning(warnings, "unknown-price", "価格が不足", "カスタム入力の価格が未入力です。残金は確定できません。");
  if (!unknownPrice && remainingCredits < 0) addWarning(warnings, "funds", "残金不足", `合計${totalCost}Cで、初期資金${STARTING_CREDITS}Cを超えています。`);

  const availableTechniqueIds = new Set([...(mainClass?.techniques ?? []), ...(subClass?.techniques ?? [])].map((item) => item.id));
  const passive = findTechnique(state.techniques.passive);
  const active = state.techniques.active.map(findTechnique).filter(Boolean);
  if (mainClass || subClass) {
    if (!passive) addWarning(warnings, "missing-passive", "パッシブ技巧が未選択", "クラス技巧からパッシブを1つ選択します。 ");
    if (active.length < 2) addWarning(warnings, "missing-active", "アクティブ技巧が不足", "クラス技巧からアクティブを2つ選択します。 ");
  }
  for (const item of [passive, ...active].filter(Boolean)) {
    if (!availableTechniqueIds.has(item.id)) addWarning(warnings, `invalid-technique-${item.id}`, "クラス技巧の候補外", `「${item.name}」は現在のメイン/サブクラスの候補にありません。`);
    if (item.options?.length && !state.techniques.choices[item.id]) addWarning(warnings, `missing-technique-choice-${item.id}`, "技巧の効果選択が未入力", `「${item.name}」の効果を選択してください。`);
  }

  const selectedClassTechniques = [passive, ...active].filter(Boolean);
  return {
    origin, mainClass, subClass, parts: resolvedParts, weapons: weaponsWithBonuses, consumables: resolvedConsumables,
    stats, statAdjustments, breakdown, outputRecovery, categoryCounts, limits, totalWeight, remainingLoad,
    totalCost, remainingCredits, warnings, notices, selectedClassTechniques, selectedTechniqueIds: selectedTechniqueIds(state), formatSigned,
  };
}

const itemName = (item) => item ? `『${item.name}』` : "未選択";
const formatCost = (item) => item?.price === null ? "未設定" : `${item?.price ?? 0}C`;
const modifierText = (item) => {
  if (!item) return "";
  const labels = { ap: "AP", action: "行動値", hit: "命中", evade: "回避", output: "出力", load: "積載", armor: "装甲" };
  return Object.entries(item.modifiers ?? {}).filter(([, value]) => value).map(([key, value]) => `${labels[key]}${formatSigned(value)}`).join(" / ") || "修正なし";
};

function buildSheetText(state, result = calculate(state)) {
  const lines = [];
  lines.push("A･S･Oキャラシテンプレート");
  lines.push(`【 パイロット名: ${state.meta.pilotName || "未入力"} 】`);
  lines.push(`【 機体名: ${state.meta.machineName || "未入力"} 】`);
  lines.push(`【 出自: ${result.origin.name} 】`);
  lines.push(`【 クラス: メイン(${result.mainClass?.name || "未選択"}) / サブ(${result.subClass?.name || "未選択"}) 】`);
  lines.push("");
  lines.push("■ A･Kステータス");
  for (const [key, label] of [["ap", "AP"], ["action", "行動値"], ["hit", "命中"], ["evade", "回避"], ["output", "出力"]]) {
    lines.push(`・${label}: [ ${BASE_STATS[key]} ] + [ ${formatSigned(result.statAdjustments[key])} ] = 【 ${result.stats[key]} 】`);
  }
  lines.push(`・出力回復: 毎ターン ${result.outputRecovery}`);
  lines.push(`・装甲（軽減）: 【 ${result.stats.armor} 】`);
  lines.push("");
  lines.push("■ アセンブル（構成パーツ）");
  for (const slot of PART_SLOTS) {
    const item = result.parts[slot];
    lines.push(`・${SLOT_LABELS[slot]}: ${itemName(item)} [企業名: ${item?.company || "-"}]`);
    lines.push(`  修正: ${modifierText(item)} / 価格: ${formatCost(item)}`);
    if (item?.type) lines.push(`  タイプ: ${item.type}`);
    if (item?.traits) lines.push(`  特性: ${item.traits}`);
  }
  lines.push("");
  lines.push(`■ 武装（積載合計: ${result.totalWeight} / 積載上限: ${result.stats.load} / 残積載: ${result.remainingLoad} ）`);
  result.weapons.forEach((item, index) => {
    if (!item) { lines.push(`${index + 1}. [ 未選択 ]`); return; }
    const power = item.damageBonus ? `${item.power} + ${item.damageBonus}` : item.power;
    lines.push(`${index + 1}. [ ${CATEGORY_LABELS[item.category]} / ${item.type} ]『${item.name}』 射程:${item.range} 属性:${item.attribute}`);
    lines.push(`   威力:${power} / 消費:${item.output ?? "未設定"} / 重量:${item.weight ?? "未設定"} / 価格:${formatCost(item)}`);
    if (item.traits) lines.push(`   特性:${item.traits}`);
  });
  lines.push("");
  lines.push("■ 所持【技巧】");
  for (const item of result.origin.techniques) lines.push(`・【技巧・${item.strength}】『${item.name}』 ${item.description}`);
  for (const item of result.selectedClassTechniques) {
    const choice = item.options?.find((option) => option.id === state.techniques.choices[item.id]);
    lines.push(`・【技巧・${item.strength}】『${item.name}』 タイミング:${item.timing}`);
    lines.push(`  ${item.description}${choice ? ` 選択:${choice.label}` : ""}`);
  }
  lines.push("");
  lines.push("■ 消耗品・所持金");
  lines.push(`・所持アイテム: ${result.consumables.filter(Boolean).map((item) => item.name).join(" / ") || "なし"}`);
  lines.push(`・残金: 【 ${result.remainingCredits}C 】（購入合計 ${result.totalCost}C）`);
  if (result.warnings.length) {
    lines.push("");
    lines.push("■ 確認事項");
    for (const warning of result.warnings) lines.push(`・${warning.title}: ${warning.detail}`);
  }
  if (state.meta.memo.trim()) { lines.push(""); lines.push("■ メモ"); lines.push(state.meta.memo.trim()); }
  return lines.join("\n");
}

function exportFilename(state, now = new Date()) {
  const rawName = state.meta.pilotName.trim() || state.meta.machineName.trim() || "無名パイロット";
  const safeName = rawName.replace(/[\\/:*?"<>|]/g, "_").slice(0, 80);
  const date = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
  return `${safeName}_${date}.json`;
}

function searchText(entry) {
  return Object.values(entry).filter((value) => typeof value === "string").join(" ").toLocaleLowerCase("ja");
}

return { createDefaultState, hydrateState, resolvePart, resolveWeapon, resolveConsumable, calculate, buildSheetText, exportFilename, searchText };
})();

const cocofoliaModule = (() => {

function valueText(value) {
  return String(value ?? "");
}

function weaponPowerText(item) {
  if (item.power === null || item.power === undefined || item.power === "") return "未設定";
  return item.damageBonus ? String(item.power) + " + " + item.damageBonus : valueText(item.power);
}

function weaponCommands(result) {
  const lines = [];
  result.weapons.filter(Boolean).forEach((item) => {
    const name = "〈" + item.name + "〉";
    const hit = "2d6+{命中}+{命中修正}";
    lines.push("### ■" + name);
    lines.push(hit + " 命中判定／" + name + " 1回目");
    lines.push(hit + "-2 命中判定／" + name + " 2回目");
    lines.push(hit + "-2 命中判定／" + name + " 3回目");
    lines.push("威力: " + weaponPowerText(item) + " / 出力-" + (item.output ?? "未設定") + " / 射程: " + (item.range || "未設定") + " / 属性: " + (item.attribute || "未記載"));
    lines.push("3回目の使用後: 次ターン終了までこの武装は使用不可");
    if (item.traits) lines.push("特性: " + item.traits);
    lines.push("");
  });
  return lines;
}

function techniqueCommands(state, result) {
  const techniques = [...result.origin.techniques, ...result.selectedClassTechniques];
  if (!techniques.length) return [];
  const lines = ["### ■技巧"];
  for (const item of techniques) {
    const choice = item.options?.find((option) => option.id === state.techniques.choices[item.id]);
    lines.push("【" + item.timing + "】『" + item.name + "』");
    lines.push(item.description + (choice ? " 選択: " + choice.label : ""));
  }
  return lines;
}

function buildCocofoliaCharacter({ state, result }) {

  return {

        { label: "回避", value: valueText(result.stats.evade) },
        { label: "回避修正", value: "0" },
        { label: "出力回復", value: valueText(result.outputRecovery) },
      ],
      faces: [],
      x: 0,
      y: 0,
      z: 0,
      angle: 0,
      width: 4,
      height: 4,
      active: true,
      secret: false,
      invisible: false,
      hideStatus: false,
      color: "",
      roomId: null,
      commands,
      speaking: true,
      name: machineName,
      memo,
    },
  };
}

return { buildCocofoliaCharacter };
})();

const exporterModule = (() => {

function safeJson(value) {
  return JSON.stringify(value)
    .replace(/</g, "\\u003c")
    .replace(/>/g, "\\u003e")
    .replace(/&/g, "\\u0026")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
}

function editablePayloadMarkup(payload) {
  return `<script id="aso-editable-payload" type="application/json">${safeJson(payload)}<\/script>`;
}

function buildEditableHtml({ documentHtml, state, images = {}, sheetId, generatedAt = new Date() }) {
  if (!documentHtml.includes("aso-editable-payload")) throw new Error("Editable HTML template is missing.");
  const payload = {
    schemaVersion: 1,
    sheetId,
    state: { ...state, exportedAt: generatedAt.toISOString() },
    images,
  };
  const marker = /<script\b(?=[^>]*\bid=["']aso-editable-payload["'])[^>]*>[\s\S]*?<\/script>/i;
  return documentHtml.replace(marker, editablePayloadMarkup(payload));
}

return { buildEditableHtml };
})();

const mediaModule = (() => {

const DB_NAME = "aso-character-sheet-media";
const STORE_NAME = "images";
const IMAGE_SLOTS = ["machine", "pilot"];
const MAX_IMAGE_BYTES = 8 * 1024 * 1024;

let databasePromise;

function openDatabase() {
  if (databasePromise) return databasePromise;
  databasePromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(STORE_NAME)) request.result.createObjectStore(STORE_NAME, { keyPath: "slot" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error ?? new Error("画像保存領域を開けませんでした。"));
  });
  return databasePromise;
}

function runRequest(mode, callback) {
  return openDatabase().then((database) => new Promise((resolve, reject) => {
    const transaction = database.transaction(STORE_NAME, mode);
    const request = callback(transaction.objectStore(STORE_NAME));
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error ?? new Error("画像保存に失敗しました。"));
  }));
}

function validateSlot(slot) {
  if (!IMAGE_SLOTS.includes(slot)) throw new Error("画像の保存先が不正です。");
}

function scopedSlot(slot, scope = "") {
  return scope ? `${scope}:${slot}` : slot;
}

async function getStoredImage(slot, scope = "") {
  validateSlot(slot);
  return runRequest("readonly", (store) => store.get(scopedSlot(slot, scope)));
}

async function getStoredImages(scope = "") {
  const entries = await Promise.all(IMAGE_SLOTS.map(async (slot) => [slot, await getStoredImage(slot, scope)]));
  return Object.fromEntries(entries);
}

async function saveStoredImage(slot, file, scope = "") {
  validateSlot(slot);
  if (!file?.type?.startsWith("image/")) throw new Error("画像ファイルを選択してください。");
  if (file.size > MAX_IMAGE_BYTES) throw new Error("画像は1枚8MB以下にしてください。");
  const storageSlot = scopedSlot(slot, scope);
  const record = { slot: storageSlot, blob: file, name: file.name, type: file.type, updatedAt: new Date().toISOString() };
  await runRequest("readwrite", (store) => store.put(record));
  return record;
}

async function removeStoredImage(slot, scope = "") {
  validateSlot(slot);
  await runRequest("readwrite", (store) => store.delete(scopedSlot(slot, scope)));
}

async function clearStoredImages(scope = "") {
  await Promise.all(IMAGE_SLOTS.map((slot) => removeStoredImage(slot, scope)));
}

function imageRecordToUrl(record) {
  return record?.dataUrl || (record?.blob ? URL.createObjectURL(record.blob) : "");
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result ?? ""));
    reader.onerror = () => reject(reader.error ?? new Error("画像を書き出せませんでした。"));
    reader.readAsDataURL(blob);
  });
}

async function getEmbeddedImages(scope = "") {
  const images = await getStoredImages(scope);
  const entries = await Promise.all(IMAGE_SLOTS.map(async (slot) => [slot, images[slot]?.blob ? await blobToDataUrl(images[slot].blob) : ""]));
  return Object.fromEntries(entries);
}

return { getStoredImage, getStoredImages, saveStoredImage, removeStoredImage, clearStoredImages, imageRecordToUrl, getEmbeddedImages };
})();

function readEditablePayload() {
  const payloadElement = document.querySelector("#aso-editable-payload");
  const text = payloadElement?.textContent?.trim();
  if (!text) return null;
  try {
    const payload = JSON.parse(text);
    if (!payload || typeof payload !== "object" || !payload.state) return null;
    return payload;
  } catch {
    return null;
  }
}

function defaultOrEmbeddedState() {
  return editablePayload?.state ? hydrateState(editablePayload.state) : createDefaultState();
}

function loadDraft() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? hydrateState(JSON.parse(saved)) : defaultOrEmbeddedState();
  } catch {
    return defaultOrEmbeddedState();
  }
}

function saveDraft() {
  state.updatedAt = new Date().toISOString();
  let persisted = true;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    persisted = false;

function renderEdit(result) {

function viewPartRows(result) { return Object.entries(result.parts).map(([slot, item]) => `<tr><th>${SLOT_LABELS[slot]}</th><td>${item ? `『${escapeHtml(item.name)}』` : "未選択"}</td><td>${escapeHtml(item?.company ?? "-")}</td><td>${item ? escapeHtml(formatPartInfo(item)) : "-"}</td></tr>`).join(""); }
function viewWeaponRows(result) { return result.weapons.map((item, index) => `<tr><th>${index + 1}</th><td>${item ? `${escapeHtml(CATEGORY_LABELS[item.category])} / 【${escapeHtml(item.type)}】『${escapeHtml(item.name)}』` : "未選択"}</td><td>${item ? `${escapeHtml(item.attribute)} / ${escapeHtml(item.range)}` : "-"}</td><td>${item ? `${escapeHtml(item.power)}${item.damageBonus ? ` + ${item.damageBonus}` : ""} / 出力${item.output ?? "-"} / 重量${item.weight ?? "-"}` : "-"}</td></tr>`).join(""); }

function imageFlipViewer() {

  return '<section class="view-image-stage"><div class="image-flip-card' + (isImageFlipped ? " is-flipped" : "") + '"><div class="image-flip-inner">' + frontFace + backFace + '</div></div>' + toggle + '</section>';

    <section class="view-section">${viewHeader("A･Kステータス", `出力回復: 毎ターン ${result.outputRecovery}`)}<div class="view-stats">${statCard("AP", 30, result.statAdjustments.ap, result.stats.ap)}${statCard("行動値", 5, result.statAdjustments.action, result.stats.action)}${statCard("命中", 6, result.statAdjustments.hit, result.stats.hit)}${statCard("回避", 7, result.statAdjustments.evade, result.stats.evade)}${statCard("出力", 4, result.statAdjustments.output, result.stats.output)}${statCard("装甲", 0, result.stats.armor, result.stats.armor)}</div></section>

    ${state.meta.memo.trim() ? `<section class="view-section"><div class="view-section-heading"><h2>メモ</h2></div><p class="memo-view">${escapeHtml(state.meta.memo)}</p></section>` : ""}

function render() {
  const result = calculate(state);
  app.innerHTML = `${header(result)}${mode === "edit" ? renderEdit(result) : renderView(result)}<footer class="page-footer">非公式MVP / ルール解釈・公開範囲は製作者確認前です</footer>`;
  bindEvents();
}

function updateComboSuggestions(input) {
  const query = input.value.trim().toLocaleLowerCase("ja");
  const root = input.closest(".combo-wrap");
  const choices = [...root.querySelectorAll(".suggestion")];
  let shown = 0;
  for (const choice of choices) {
    const matches = !query || choice.dataset.search.includes(query);
    const visible = matches && shown < 8;
    choice.hidden = !visible;
    if (visible) shown += 1;
  }
  root.classList.add("is-open");
  root.querySelector(".no-suggestion").hidden = shown !== 0;
}

function updateComboCustom(kind, key, value) {
  if (kind === "part") { state.parts[key].id = ""; state.parts[key].custom.name = value; }
  if (kind === "weapon") { state.weapons[Number(key)].id = ""; state.weapons[Number(key)].custom.name = value; }
  if (kind === "consumable") { state.consumables[Number(key)].id = ""; state.consumables[Number(key)].custom.name = value; }
  saveDraft();
}

function selectCombo(kind, key, id) {
  if (kind === "part") { state.parts[key].id = id; state.parts[key].custom.name = ""; }
  if (kind === "weapon") { state.weapons[Number(key)].id = id; state.weapons[Number(key)].custom.name = ""; }
  if (kind === "consumable") { state.consumables[Number(key)].id = id; state.consumables[Number(key)].custom.name = ""; }
  saveDraft();
  render();
}

function bindEvents() {
  document.querySelectorAll("[data-path]").forEach((element) => {
    const apply = () => {
      setPath(element.dataset.path, element.value);
      saveDraft();
    };
    element.addEventListener("input", apply);
    element.addEventListener("change", () => { apply(); render(); });
    element.addEventListener("blur", () => { apply(); render(); });
  });
  document.querySelectorAll("[data-combo-kind]").forEach((input) => {
    input.addEventListener("input", () => { updateComboCustom(input.dataset.comboKind, input.dataset.key, input.value); updateComboSuggestions(input); });
    input.addEventListener("focus", () => updateComboSuggestions(input));
    input.addEventListener("blur", () => window.setTimeout(() => input.closest(".combo-wrap")?.classList.remove("is-open"), 120));
  });
  document.querySelectorAll("[data-export-format]").forEach((select) => select.addEventListener("change", () => { exportFormat = select.value; render(); }));
  document.querySelectorAll("[data-image-upload]").forEach((input) => input.addEventListener("change", async () => {
    const [file] = input.files ?? [];
    if (!file) return;
    try {
      await replaceImage(input.dataset.imageUpload, file);
    } catch (error) {
      window.alert(error instanceof Error ? error.message : "画像を保存できませんでした。");
    }
  }));
  document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", handleAction));
}

async function copyText() {
  const text = buildSheetText(state);
  try {
    await navigator.clipboard.writeText(text);
    const button = document.querySelector('[data-action="copy-text"]');
    if (button) { button.textContent = "コピーしました"; window.setTimeout(() => { button.textContent = "テキストをコピー"; }, 1600); }
  } catch {
    const area = document.querySelector("#sheet-text");
    area?.select();
    document.execCommand("copy");
  }
}

async function copyCocofoliaJson() {
  const content = JSON.stringify(buildCocofoliaCharacter({ state, result: calculate(state) }), null, 2);
  let copied = false;
  try {
    await navigator.clipboard.writeText(content);
    copied = true;
  } catch {
    const area = document.createElement("textarea");
    area.value = content;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    copied = document.execCommand("copy");
    area.remove();
  }
  if (!copied) {
    window.alert("ココフォリア用JSONをコピーできませんでした。ブラウザのクリップボード許可を確認してください。");
    return;
  }
  const button = document.querySelector('[data-action="export-selected"]');
  if (button) {
    button.textContent = "✓";
    window.setTimeout(() => { button.textContent = "⧉"; }, 1600);
  }
}

function downloadFile(content, type, filename) {
  const blob = new Blob([content], { type });
  const anchor = document.createElement("a");
  anchor.href = URL.createObjectURL(blob);
  anchor.download = filename;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(anchor.href);
}

function sharedFilename(extension) {
  return exportFilename(state).replace(/\.json$/, `.${extension}`);
}


function exportTemplate() {
  downloadFile(`\uFEFF${buildSheetText(state)}`, "text/plain;charset=utf-8", sharedFilename("txt"));
}

function createSheetId() {
  if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
  return `aso-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

function currentStandaloneDocument() {
  const moduleEntry = document.querySelector('script[type="module"][src]');
  return moduleEntry ? null : `<!doctype html>\n${document.documentElement.outerHTML}`;
}

async function editableTemplateDocument() {
  const currentDocument = currentStandaloneDocument();
  if (currentDocument) return currentDocument;
  const response = await fetch("./editable-template.html", { cache: "no-store" });
  if (!response.ok) throw new Error("編集用HTMLテンプレートを読み込めませんでした。");
  return response.text();
}

async function imagesForEditableHtml() {
  const storedImages = await getEmbeddedImages(imageStorageScope);
  return {
    machine: storedImages.machine || (!removedImageSlots.has("machine") ? embeddedImages.machine || imageRecords.machine?.dataUrl || "" : ""),
    pilot: storedImages.pilot || (!removedImageSlots.has("pilot") ? embeddedImages.pilot || imageRecords.pilot?.dataUrl || "" : ""),
  };
}

async function exportHtml() {
  const [documentHtml, images] = await Promise.all([editableTemplateDocument(), imagesForEditableHtml()]);
  const sheetId = editablePayload?.sheetId || createSheetId();
  const html = buildEditableHtml({ documentHtml, state, images, sheetId });
  downloadFile(html, "text/html;charset=utf-8", sharedFilename("html"));
}

async function exportSelected() {
  if (exportFormat === "cocofolia") { copyCocofoliaJson(); return; }
  if (exportFormat === "template") { exportTemplate(); return; }
  try {
    await exportHtml();
  } catch {
    window.alert("キャラクターHTMLを書き出せませんでした。");
  }
}

async function handleAction(event) {
  const button = event.currentTarget;
  const action = button.dataset.action;
  if (action === "switch-mode") { mode = button.dataset.mode; render(); return; }
  if (action === "flip-images") { isImageFlipped = !isImageFlipped; render(); return; }
  if (action.startsWith("choose-")) { selectCombo(action.replace("choose-", ""), button.dataset.key, button.dataset.id); return; }
  if (action === "clear-weapon") { state.weapons[Number(button.dataset.index)] = createDefaultState().weapons[0]; saveDraft(); render(); return; }
  if (action === "add-consumable") { state.consumables.push(createDefaultState().consumables[0]); saveDraft(); render(); return; }
  if (action === "remove-consumable") { state.consumables.splice(Number(button.dataset.index), 1); saveDraft(); render(); return; }
  if (action === "remove-image") {
    try {
      await removeImage(button.dataset.imageSlot);
    } catch {
      window.alert("画像を削除できませんでした。");
    }
    return;
  }
  if (action === "copy-text") { copyText(); return; }
  if (action === "export-selected") { await exportSelected(); return; }
  if (action === "new-sheet") {
    if (window.confirm("現在の下書きを新しい空のシートに置き換えます。HTMLを書き出していない内容は戻せません。続けますか？")) {
      state = createDefaultState();
      try { await removeAllImages(); } catch { resetImageState(); }
      saveDraft();
      mode = "edit";
      render();
    }
  }
}


render();

function wireframeValue(value, fallback = "-") {
  return value === null || value === undefined || value === "" ? fallback : String(value);
}

function wireframeSigned(value) {
  return (value >= 0 ? "+" : "") + value;
}

function wireframePartModifiers(item, custom) {
  const labels = { ap: "AP", action: "行動", hit: "命中", evade: "回避", output: "出力", load: "積載", armor: "装甲" };
  const source = item ? item.modifiers : custom;
  const values = Object.entries(source ?? {}).filter(([key, value]) => key in labels && value !== "" && Number(value) !== 0);
  return values.length ? values.map(([key, value]) => labels[key] + wireframeSigned(Number(value))).join(" / ") : "修正なし";
}

function wireframePartTraits(item, custom) {
  const source = item ?? custom;
  return [source?.type, source?.traits].filter(Boolean).join(" / ") || "-";
}

function wireframePrice(value) {
  return value === null || value === undefined || value === "" ? "-" : value + "C";
}

function wireframeCombo({ kind, key, value, placeholder, entries, label, compact = false }) {
  const keyData = escapeHtml(key);
  const fieldClass = compact ? "table-combo-field" : "field-wide";
  const labelClass = compact ? "sr-only" : "";
  const list = entries.map((entry) => {
    const labelText = kind === "part"
      ? entry.company + " / " + SLOT_LABELS[entry.slot] + " / 『" + entry.name + "』"
      : kind === "weapon"
        ? entry.company + " / " + CATEGORY_LABELS[entry.category] + " / 【" + entry.type + "】『" + entry.name + "』"
        : entry.name + " / " + entry.price + "C";
    return '<button type="button" class="suggestion" data-action="choose-' + kind + '" data-key="' + keyData + '" data-id="' + entry.id + '" data-search="' + escapeHtml(searchText(entry)) + '">' + escapeHtml(labelText) + '</button>';
  }).join("");
  return '<div class="combo-wrap ' + (compact ? "table-combo-wrap" : "") + '"><label class="field ' + fieldClass + '"><span class="' + labelClass + '">' + label + '</span><input class="combo-input" autocomplete="off" data-combo-kind="' + kind + '" data-key="' + keyData + '" value="' + escapeHtml(value ?? "") + '" placeholder="' + escapeHtml(placeholder) + '" /></label><div class="suggestions" role="listbox">' + list + '<p class="no-suggestion" hidden>一致するデータはありません。入力内容はカスタム扱いで保存できます。</p></div></div>';
}

function wireframePartRow(slot) {
  const entry = getPartEntry(slot);
  const item = entry.id ? findPart(entry.id) : null;
  const customDetails = item || !entry.custom.name ? "" : selectedPartInfo(slot);
  const candidates = parts.filter((candidate) => candidate.slot === slot);
  const company = item?.company ?? entry.custom.company;
  const price = item?.price ?? entry.custom.price;
  return '<tr><th scope="row">' + SLOT_LABELS[slot] + '</th><td class="part-name">' + wireframeCombo({ kind: "part", key: slot, value: partDisplay(slot), label: SLOT_LABELS[slot], placeholder: SLOT_LABELS[slot] + "を検索", entries: candidates, compact: true }) + customDetails + '</td><td>' + escapeHtml(wireframeValue(company)) + '</td><td class="compact">' + escapeHtml(wireframePartModifiers(item, entry.custom)) + '</td><td class="number">' + escapeHtml(wireframePrice(price)) + '</td><td class="traits">' + escapeHtml(wireframePartTraits(item, entry.custom)) + '</td></tr>';
}

function wireframePartsEditor() {
  const rows = ["head", "torso", "legs", "generator"].map(wireframePartRow).join("");
  const body = '<div class="table-wrap"><table class="assemble-table"><thead><tr><th>部位</th><th>パーツ</th><th>企業</th><th>修正</th><th>価格</th><th>タイプ・特性</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return section("アセンブル", body, { meta: "パーツ名で候補を検索" });
}

function wireframeWeaponRow(index) {
  const entry = getWeaponEntry(index);
  const item = entry.id ? findWeapon(entry.id) : null;
  const custom = entry.custom;
  const type = item ? CATEGORY_LABELS[item.category] + " / " + item.type : custom.name ? (CATEGORY_LABELS[custom.category] ?? custom.category) + (custom.type ? " / " + custom.type : "") : "未選択";
  const power = item ? String(item.power) + (item.damageBonus ? " + " + item.damageBonus : "") : wireframeValue(custom.power);
  const traits = [item?.attribute ?? custom.attribute, item?.traits ?? custom.traits].filter(Boolean).join(" / ") || "-";
  const customDetails = item || !custom.name ? "" : selectedWeaponInfo(index);
  return '<tr><th scope="row">' + (index + 1) + '</th><td class="weapon-name">' + wireframeCombo({ kind: "weapon", key: String(index), value: weaponDisplay(index), label: "武装 " + (index + 1), placeholder: "武装名を検索", entries: weapons, compact: true }) + customDetails + '</td><td class="compact">' + escapeHtml(type) + '</td><td class="number">' + escapeHtml(power) + '</td><td>' + escapeHtml(wireframeValue(item?.range ?? custom.range)) + '</td><td>' + escapeHtml(wireframeValue(item?.output ?? custom.output)) + '</td><td>' + escapeHtml(wireframeValue(item?.weight ?? custom.weight)) + '</td><td class="number">' + escapeHtml(wireframePrice(item?.price ?? custom.price)) + '</td><td class="traits">' + escapeHtml(traits) + '</td><td><button type="button" class="remove-row table-remove" data-action="clear-weapon" data-index="' + index + '" title="この武装枠を空にする" aria-label="武装 ' + (index + 1) + ' を外す">×</button></td></tr>';
}

function wireframeWeaponEditor(result = calculate(state)) {
  const rows = state.weapons.map((_, index) => wireframeWeaponRow(index)).join("");
  const equippedCount = result.weapons.filter(Boolean).length;
  const restrictedNames = result.weapons.filter((item) => item?.flags?.includes("reduces-light")).map((item) => item.name);
  const meta = restrictedNames.length
    ? "武装枠 " + equippedCount + " / " + result.limits.total + "（" + restrictedNames.join("、") + "により追加1枠を消費）"
    : "武装枠 " + equippedCount + " / " + result.limits.total;
  const body = '<div class="table-wrap"><table class="weapon-table"><thead><tr><th>#</th><th>武装</th><th>種別</th><th>威力</th><th>射程</th><th>消費</th><th>重量</th><th>価格</th><th>特性</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return section("武装", body, { meta });
}

function wireframeIdentity(result) {

function wireframeStat(label, value, detail, tone = "") {

}

function wireframeStats(result) {
  const stats = result.stats;
  const cards = [
    wireframeStat("AP", stats.ap, "30 " + wireframeSigned(result.statAdjustments.ap)),
    wireframeStat("行動値", stats.action, "5 " + wireframeSigned(result.statAdjustments.action)),
    wireframeStat("命中", stats.hit, "6 " + wireframeSigned(result.statAdjustments.hit)),
    wireframeStat("回避", stats.evade, "7 " + wireframeSigned(result.statAdjustments.evade)),
    wireframeStat("出力", stats.output, "4 " + wireframeSigned(result.statAdjustments.output) + " / 回復 " + result.outputRecovery),
    wireframeStat("装甲", stats.armor, "0 " + wireframeSigned(stats.armor)),
    wireframeStat("残積載", result.remainingLoad, result.totalWeight + " / " + stats.load, result.remainingLoad < 0 ? "negative" : "teal"),

  ];

function wireframePersonalClassEditor() {

  const passive = techniqueOptions("パッシブ");
  const active = techniqueOptions("アクティブ");
  const originControl = state.origin === "human"
    ? selectField("人間の補正", "humanBonus", state.humanBonus, [{ value: "hit", label: "命中+1" }, { value: "evade", label: "回避+1" }])
    : '<div class="field muted-field"><span>出自補正</span><b>行動値+1 / 出力+2</b></div>';
  const vanguardControl = state.classes.main === "vanguard"
    ? selectField("ヴァンガード補正", "classes.vanguardBonus", state.classes.vanguardBonus, [{ value: "evade", label: "回避+1" }, { value: "armor", label: "装甲+1" }])
    : "";
  const vanguardSlot = vanguardControl || '<div class="build-empty" aria-hidden="true"></div>';
  const body = '<div class="profile-memo-layout">' +
    '<div class="personal-column">' +
      field("パイロット名", "meta.pilotName", state.meta.pilotName, { placeholder: "例: ジョン・ドゥ" }) +
      field("機体名", "meta.machineName", state.meta.machineName, { placeholder: "例: UNKNOWN:LUCK" }) +
      field("プレイヤー名", "meta.playerName", state.meta.playerName) +
    '</div>' +
    '<div class="memo-column">' +
      field("メモ", "meta.memo", state.meta.memo, { type: "textarea", rows: 6, wide: true }) +
    '</div>' +
  '</div><div class="build-grid">' +
      selectField("出自", "origin", state.origin, origins.map((item) => ({ value: item.id, label: item.name }))) +
      originControl +
      selectField("メインクラス", "classes.main", state.classes.main, classChoices) +
      selectField("サブクラス", "classes.sub", state.classes.sub, classChoices) +
      techniqueSelect("パッシブ技巧", "techniques.passive", state.techniques.passive, passive, { wide: false }) +
      techniqueSelect("アクティブ技巧 1", "techniques.active.0", state.techniques.active[0], active, { wide: false }) +
      techniqueSelect("アクティブ技巧 2", "techniques.active.1", state.techniques.active[1], active, { wide: false }) +
      vanguardSlot +
      techniqueChoiceInputs() +
  '</div>';
  return section("パーソナルデータ・クラス", body, { meta: "入力内容は自動保存" });
}

function wireframeConfirmation(result) {
  const message = result.warnings.length
    ? '<ul>' + result.warnings.map((warning) => '<li><b>' + escapeHtml(warning.title) + '</b><span>' + escapeHtml(warning.detail) + '</span></li>').join("") + '</ul>'
    : '<span>判定上の警告はありません。</span>';
  const stateClass = result.warnings.length ? "notice warning-notice" : "notice";
  return '<section class="editor-section confirmation-section"><div class="' + stateClass + '"><strong>確認事項</strong><div>' + message + '</div></div></section>';
}

function wireframeRenderEdit(result) {
  return '<main class="app-layout wireframe-layout">' + wireframeIdentity(result) + wireframeStats(result) + '<div class="editor-column">' + wireframePersonalClassEditor() + wireframePartsEditor() + wireframeWeaponEditor(result) + consumableEditor() + wireframeConfirmation(result) + '</div></main>';
}

function imageEditorSlot(slot, label) {
  const imageUrl = imageUrls[slot];
  const fileName = imageRecords[slot]?.name ?? "";
  const preview = imageUrl
    ? '<img src="' + escapeHtml(imageUrl) + '" alt="' + label + '">'
    : '<span class="image-empty">画像未設定</span>';
  const remove = imageUrl
    ? '<button type="button" class="image-remove-button" data-action="remove-image" data-image-slot="' + slot + '">画像を外す</button>'
    : "";
  return '<article class="image-editor-slot"><div class="image-editor-preview">' + preview + '</div><div class="image-editor-controls"><b>' + label + '</b><small>' + escapeHtml(fileName) + '</small><div><label class="image-upload-button">画像を選択<input type="file" accept="image/*" data-image-upload="' + slot + '"></label>' + remove + '</div></div></article>';
}

function wireframeImageEditor() {
  return section("画像", '<div class="image-editor-grid">' + imageEditorSlot("machine", "機体画像") + imageEditorSlot("pilot", "パイロット画像") + '</div>');
}

const baseWireframeRenderEdit = wireframeRenderEdit;
const baseRenderView = renderView;
renderEdit = (result) => baseWireframeRenderEdit(result).replace('<div class="editor-column">', '<div class="editor-column">' + wireframeImageEditor());
renderView = (result) => {
  const imageViewer = imageFlipViewer();
  if (!imageViewer) return baseRenderView(result);
  return baseRenderView(result).replace('</dl></section>\n    <section class="view-section">', '</dl></section>' + imageViewer + '\n    <section class="view-section">');
};

combo = wireframeCombo;
partsEditor = wireframePartsEditor;
weaponEditor = wireframeWeaponEditor;
classEditor = wireframePersonalClassEditor;
renderEdit = (result) => baseWireframeRenderEdit(result).replace('<div class="editor-column">', '<div class="editor-column">' + wireframeImageEditor());
render();
void loadStoredImages();

return {  };
})();
    </script>
  </body>
</html>
